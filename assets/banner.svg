<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">groundhog</title>
  <desc id="d">Three different commands all hit the same error wall. groundhog notices the repeat and makes the agent stop and rethink.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15110d"/>
      <stop offset="1" stop-color="#241a12"/>
    </linearGradient>
    <pattern id="bricks" width="44" height="22" patternUnits="userSpaceOnUse">
      <rect width="44" height="22" fill="#7a2e22"/>
      <path d="M0 0.5H44M0 11.5H44M22 0V11M0 11V22M44 11V22" stroke="#4d1c15" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- left: title -->
  <text x="64" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f4e9d8">groundhog</text>
  <text x="66" y="182" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#d8c3a5">Your agent keeps waking up in the same error.</text>
  <text x="66" y="214" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#f2a65a" font-weight="600">groundhog notices, and makes it rethink.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a8957c">
    <text x="66" y="278">Claude Code plugin · zero dependencies · no network</text>
    <text x="66" y="304">English · Español</text>
  </g>

  <!-- right: three attempts converge on one wall -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <g fill="#c9b79c">
      <text x="640" y="92">$ node scripts/migrate.js</text>
      <text x="640" y="172">$ node ./scripts/migrate.js --env dev</text>
      <text x="640" y="252">$ npm run migrate -- --force</text>
    </g>
    <g stroke="#f2a65a" stroke-width="2" fill="none" stroke-dasharray="6 6">
      <path d="M915 87 C 970 87, 985 150, 1012 172"/>
      <path d="M965 167 L 1012 172"/>
      <path d="M905 247 C 970 247, 985 195, 1012 172"/>
    </g>
  </g>
  <rect x="1016" y="56" width="34" height="232" fill="url(#bricks)" stroke="#3a140f" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="806" y="300" width="330" height="48" rx="8" fill="#2d2118" stroke="#f2a65a" stroke-width="1.5"/>
    <text x="822" y="320" font-size="13" fill="#f2a65a">same wall · 3rd hit</text>
    <text x="822" y="338" font-size="13" fill="#f4e9d8">Cannot find module '&lt;path&gt;'</text>
  </g>
</svg>
